name: Mettre à jour la veille

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer le flux local
        run: python scripts/update_veille.py

      - name: Publier les nouveaux articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille.json
          git diff --cached --quiet || git commit -m "chore: mettre à jour la veille technologique"
          git push
